<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>المتجر الرقمي</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

    <header class="topbar">

        <div>
            <div class="brand">
                المتجر الرقمي
            </div>

            <div class="welcome" id="welcome">
                جاري التحميل...
            </div>
        </div>

        <div class="balance">

            <span>⭐</span>

            <div>
                <small>رصيدك</small>
                <strong id="balance">0</strong>
            </div>

        </div>

    </header>


    <main>

        <section class="hero">

            <div>
                <span class="hero-label">
                    DIGITAL STORE
                </span>

                <h1>
                    اختر خدمتك
                </h1>

                <p>
                    استخدم نقاطك لشراء الخدمات الرقمية المتوفرة.
                </p>
            </div>

        </section>


        <div class="section-title">

            <h2>
                المنتجات
            </h2>

            <span id="productsCount">
                0 منتج
            </span>

        </div>


        <div
            class="products"
            id="products"
        ></div>

    </main>

</div>


<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="/app.js"></script>

</body>
</html>
