<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#07111f">

    <title>المتجر الرقمي</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/style.css">

    <style>
        /* =========================
           CORE
        ========================= */

        :root {
            --blue-950: #030914;
            --blue-900: #061221;
            --blue-850: #08182b;
            --blue-800: #0b1e34;
            --blue-700: #0d2947;
            --blue: #1677d2;
            --blue-light: #2e9aff;

            --gold: #f5b83d;
            --gold-light: #ffd86b;
            --gold-dark: #b47a16;

            --white: #f5f8fc;
            --text: #dce7f4;
            --muted: #8192a8;

            --border: rgba(83, 154, 221, .16);
            --border-gold: rgba(245, 184, 61, .22);

            --shadow:
                0 20px 60px rgba(0, 0, 0, .35);

            --radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--blue-950);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background:
                radial-gradient(
                    circle at 90% 0%,
                    rgba(24, 121, 218, .18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 30%,
                    rgba(245, 184, 61, .055),
                    transparent 25%
                ),
                linear-gradient(
                    145deg,
                    #030914 0%,
                    #061221 48%,
                    #07182b 100%
                );

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding:
                max(18px, env(safe-area-inset-top))
                18px
                max(30px, env(safe-area-inset-bottom));
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;

            padding: 18px;

            border: 1px solid var(--border);

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    rgba(14, 38, 67, .94),
                    rgba(5, 17, 31, .96)
                );

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .topbar::before {
            content: "";

            position: absolute;

            top: 0;
            right: 8%;
            left: 8%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(245, 184, 61, .7),
                    transparent
                );
        }

        .topbar::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -120px;
            right: -70px;

            background: rgba(24, 119, 210, .13);

            filter: blur(30px);

            border-radius: 50%;

            pointer-events: none;
        }

        /* =========================
           BRAND
        ========================= */

        .brand-area {
            display: flex;
            align-items: center;
            gap: 14px;

            min-width: 0;
        }

        .brand-logo {
            width: 54px;
            height: 54px;

            flex: 0 0 54px;

            object-fit: cover;

            border-radius: 16px;

            border: 1px solid var(--border-gold);

            background: #071321;

            box-shadow:
                0 0 0 4px rgba(245, 184, 61, .035),
                0 10px 30px rgba(0, 0, 0, .3);
        }

        .brand-info {
            min-width: 0;
        }

        .brand {
            color: var(--white);

            font-size: 18px;
            font-weight: 850;

            letter-spacing: -.3px;

            white-space: nowrap;
        }

        .brand span {
            color: var(--gold);
        }

        .welcome {
            margin-top: 5px;

            color: var(--muted);

            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            direction: rtl;
        }

        /* =========================
           USER PROFILE
        ========================= */

        .user-profile {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            gap: 11px;

            min-width: 0;

            padding: 7px 8px 7px 12px;

            border: 1px solid rgba(255,255,255,.07);

            border-radius: 18px;

            background:
                rgba(1, 10, 20, .42);

            direction: ltr;
        }

        .user-avatar-wrap {
            position: relative;

            width: 48px;
            height: 48px;

            flex: 0 0 48px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid var(--gold);

            background: #10243b;

            box-shadow:
                0 0 0 3px rgba(245,184,61,.08),
                0 8px 20px rgba(0,0,0,.35);
        }

        .online-dot {
            position: absolute;

            width: 11px;
            height: 11px;

            left: 1px;
            bottom: 2px;

            border-radius: 50%;

            background: #5ee58a;

            border: 2px solid #071321;

            box-shadow: 0 0 10px rgba(94,229,138,.5);
        }

        .user-details {
            min-width: 0;

            direction: rtl;
            text-align: right;
        }

        .user-name {
            max-width: 145px;

            color: var(--white);

            font-size: 14px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id {
            margin-top: 3px;

            color: var(--muted);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 10px;

            direction: ltr;
            text-align: right;

            white-space: nowrap;
        }

        /* =========================
           BALANCE
        ========================= */

        .balance {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 9px 13px;

            border: 1px solid var(--border-gold);

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(245,184,61,.09),
                    rgba(245,184,61,.025)
                );

            direction: rtl;

            white-space: nowrap;
        }

        .balance-icon {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: var(--gold);

            background:
                rgba(245,184,61,.1);

            border: 1px solid rgba(245,184,61,.16);

            font-size: 17px;
        }

        .balance small {
            display: block;

            color: var(--muted);

            font-size: 10px;
            margin-bottom: 2px;
        }

        .balance strong {
            display: block;

            color: var(--gold-light);

            font-size: 15px;
            font-weight: 850;

            direction: ltr;
            text-align: right;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;

            margin-top: 18px;

            min-height: 220px;

            display: flex;
            align-items: flex-end;

            padding: 30px;

            overflow: hidden;

            border-radius: 28px;

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    115deg,
                    rgba(12, 49, 87, .96),
                    rgba(5, 19, 34, .97)
                );

            box-shadow: var(--shadow);
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            top: -180px;
            left: -70px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(40, 147, 239, .22),
                    transparent 68%
                );
        }

        .hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent 50%,
                    rgba(245,184,61,.045) 100%
                );

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            max-width: 650px;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;

            padding: 6px 10px;

            color: var(--gold);

            border: 1px solid rgba(245,184,61,.18);

            border-radius: 999px;

            background: rgba(245,184,61,.06);

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.7px;
        }

        .hero h1 {
            margin-top: 12px;

            color: #fff;

            font-size: clamp(28px, 5vw, 44px);

            line-height: 1.1;

            font-weight: 900;

            letter-spacing: -.8px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            max-width: 570px;

            margin-top: 11px;

            color: #91a7bf;

            font-size: 14px;

            line-height: 1.8;
        }

        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 28px 3px 14px;
        }

        .section-title h2 {
            color: #fff;

            font-size: 20px;
            font-weight: 850;
        }

        .section-title h2::after {
            content: "";

            display: block;

            width: 34px;
            height: 3px;

            margin-top: 6px;

            border-radius: 99px;

            background: var(--gold);
        }

        .section-title span {
            color: var(--muted);

            font-size: 11px;

            padding: 7px 11px;

            border: 1px solid var(--border);

            border-radius: 999px;

            background: rgba(255,255,255,.025);
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 15px;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            grid-column: 1 / -1;

            padding: 55px 20px;

            text-align: center;

            border: 1px dashed var(--border);

            border-radius: 22px;

            background: rgba(255,255,255,.015);
        }

        .empty-state-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty-state h3 {
            color: #fff;
            font-size: 15px;
        }

        .empty-state p {
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 18px;

            background:
                rgba(0, 4, 10, .78);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            position: relative;

            width: min(100%, 480px);

            max-height: 90vh;
            overflow: auto;

            padding: 25px;

            border: 1px solid var(--border);

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #0a1c31,
                    #050e19
                );

            box-shadow:
                0 30px 90px rgba(0,0,0,.55);
        }

        .close {
            position: absolute;

            top: 13px;
            left: 13px;

            width: 34px;
            height: 34px;

            border: 1px solid var(--border);

            border-radius: 11px;

            color: #a9b9ca;

            background: rgba(255,255,255,.04);

            font-size: 22px;

            cursor: pointer;
        }

        .close:active {
            transform: scale(.94);
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;

            z-index: 2000;

            right: 50%;
            bottom: 22px;

            transform:
                translateX(50%)
                translateY(20px);

            opacity: 0;

            pointer-events: none;

            max-width: calc(100% - 30px);

            padding: 12px 17px;

            border: 1px solid var(--border-gold);

            border-radius: 14px;

            background:
                rgba(6,18,32,.96);

            color: var(--white);

            font-size: 12px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.4);

            transition:
                .25s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(50%)
                translateY(0);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 760px) {

            .app {
                padding-left: 12px;
                padding-right: 12px;
            }

            .topbar {
                display: grid;

                grid-template-columns: 1fr auto;

                gap: 12px;

                padding: 13px;
            }

            .brand-logo {
                width: 46px;
                height: 46px;

                flex-basis: 46px;
            }

            .brand {
                font-size: 16px;
            }

            .user-profile {
                grid-column: 1 / -1;

                width: 100%;

                justify-content: flex-start;

                padding: 8px 10px;
            }

            .user-details {
                flex: 1;
            }

            .user-name {
                max-width: none;
            }

            .balance {
                padding: 7px 9px;
            }

            .balance-icon {
                width: 31px;
                height: 31px;
            }

            .hero {
                min-height: 205px;

                padding: 24px 20px;

                border-radius: 23px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 13px;
            }

            .products {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }

        }

        @media (max-width: 390px) {

            .products {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 27px;
            }

            .user-avatar,
            .user-avatar-wrap {
                width: 44px;
                height: 44px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

        <div class="brand-area">

            <img
                class="brand-logo"
                src="https://i.imgur.com/Z8xh0Af.png"
                alt="شعار المتجر"
            >

            <div class="brand-info">

                <div class="brand">
                    المتجر <span>الرقمي</span>
                </div>

                <div
                    class="welcome"
                    id="welcome"
                >
                    جاري تحميل الحساب...
                </div>

            </div>

        </div>


        <!-- USER -->

        <div class="user-profile">

            <div class="user-avatar-wrap">

                <img
                    id="userAvatar"
                    class="user-avatar"
                    src="https://i.imgur.com/Z8xh0Af.png"
                    alt="صورة المستخدم"
                >

                <span class="online-dot"></span>

            </div>


            <div class="user-details">

                <div
                    class="user-name"
                    id="userName"
                >
                    جاري التحميل...
                </div>

                <div
                    class="user-id"
                    id="userId"
                >
                    ID: ------
                </div>

            </div>

        </div>


        <!-- BALANCE -->

        <div class="balance">

            <div class="balance-icon">
                ⭐
            </div>

            <div>

                <small>
                    رصيدك
                </small>

                <strong id="balance">
                    0
                </strong>

            </div>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <span class="hero-label">
                    DIGITAL STORE
                </span>

                <h1>
                    خدماتك الرقمية
                    <span>بلمسة واحدة</span>
                </h1>

                <p>
                    مرحبًا بك في متجرك الرقمي.
                    اختر الخدمة التي تريدها واستخدم رصيدك
                    لإتمام طلبك بسهولة وسرعة.
                </p>

            </div>

        </section>


        <!-- PRODUCTS TITLE -->

        <div class="section-title">

            <h2>
                المنتجات
            </h2>

            <span id="productsCount">
                0 منتج
            </span>

        </div>


        <!-- PRODUCTS -->

        <div
            class="products"
            id="products"
        ></div>

    </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <button
            class="close"
            type="button"
            onclick="closeModal()"
            aria-label="إغلاق"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
    class="toast"
    id="toast"
></div>


<script>
    /*
     * Telegram WebApp
     */

    const tg = window.Telegram?.WebApp;

    if (tg) {

        tg.ready();

        tg.expand();

        /*
         * محاولة استخدام ألوان Telegram
         * بدون تغيير التصميم الأساسي.
         */

        try {
            tg.setHeaderColor("#071321");
            tg.setBackgroundColor("#030914");
        } catch (error) {
            console.log("Telegram theme setup skipped");
        }


        /*
         * بيانات المستخدم من Telegram.
         *
         * photo_url موجودة عندما يوفرها Telegram
         * ويمكن استخدامها مباشرة لصورة الحساب.
         */

        const telegramUser =
            tg.initDataUnsafe?.user;


        if (telegramUser) {

            const avatar =
                document.getElementById("userAvatar");

            const userName =
                document.getElementById("userName");

            const userId =
                document.getElementById("userId");

            const welcome =
                document.getElementById("welcome");


            /*
             * الصورة
             */

            if (telegramUser.photo_url) {

                avatar.src =
                    telegramUser.photo_url;

            }


            /*
             * الاسم
             */

            const fullName =
                [
                    telegramUser.first_name || "",
                    telegramUser.last_name || ""
                ]
                .join(" ")
                .trim();


            userName.textContent =
                fullName ||
                telegramUser.username ||
                "مستخدم Telegram";


            /*
             * ID
             */

            userId.textContent =
                `ID: ${telegramUser.id}`;


            /*
             * رسالة الترحيب
             */

            welcome.textContent =
                telegramUser.username
                    ? `@${telegramUser.username}`
                    : "حساب Telegram";


        } else {

            document.getElementById("userName")
                .textContent =
                "افتح المتجر من Telegram";

            document.getElementById("userId")
                .textContent =
                "Telegram Web App";

            document.getElementById("welcome")
                .textContent =
                "لم يتم العثور على بيانات الحساب";
        }

    }
</script>


<script src="/app.js"></script>

</body>
</html>
