<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#071321">

    <title>المتجر الليبي | Libyan Store</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/style.css">

    <style>
        :root {
            --blue-950: #030914;
            --blue-900: #061221;
            --blue-850: #08182b;
            --blue-800: #0b1e34;
            --blue-700: #0d2947;

            --blue: #1677d2;
            --blue-light: #319cff;

            --gold: #f5b83d;
            --gold-light: #ffd86b;

            --white: #f7faff;
            --text: #dce7f4;
            --muted: #8192a8;

            --green: #63e69a;
            --red: #ff6868;

            --border: rgba(83,154,221,.16);
            --border-gold: rgba(245,184,61,.24);

            --shadow:
                0 24px 70px rgba(0,0,0,.36);

            --radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--blue-950);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 90% 0%,
                    rgba(22,119,210,.17),
                    transparent 31%
                ),
                radial-gradient(
                    circle at 5% 30%,
                    rgba(245,184,61,.045),
                    transparent 25%
                ),
                linear-gradient(
                    145deg,
                    #030914 0%,
                    #061221 48%,
                    #07182b 100%
                );

            font-family:
                "Cairo",
                system-ui,
                sans-serif;
        }

        html[lang="en"] body {
            font-family:
                "Inter",
                system-ui,
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            max-width: 100%;
        }

        .app {
            width: 100%;
            max-width: 1180px;

            margin: 0 auto;

            padding:
                max(14px, env(safe-area-inset-top))
                14px
                max(30px, env(safe-area-inset-bottom));
        }

        /* TOP BAR */

        .topbar {
            position: relative;

            display: grid;

            grid-template-columns: auto 1fr auto;

            align-items: center;

            gap: 16px;

            padding: 14px;

            border: 1px solid var(--border);
            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(14,38,67,.96),
                    rgba(5,17,31,.98)
                );

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .topbar::before {
            content: "";

            position: absolute;

            top: 0;
            left: 8%;
            right: 8%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(245,184,61,.65),
                    transparent
                );
        }

        /* BRAND */

        .brand-area {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .brand-logo {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            object-fit: cover;

            border-radius: 15px;

            border: 1px solid var(--border-gold);

            background: #071321;

            box-shadow:
                0 0 0 4px rgba(245,184,61,.035),
                0 10px 28px rgba(0,0,0,.3);
        }

        .brand-info {
            min-width: 0;
        }

        .brand {
            color: var(--white);

            font-size: 18px;
            font-weight: 900;

            line-height: 1.3;

            white-space: nowrap;
        }

        .brand span {
            color: var(--gold);
        }

        .brand-subtitle {
            margin-top: 2px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 600;

            direction: ltr;
        }

        .welcome {
            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* USER */

        .user-profile {
            display: flex;
            align-items: center;

            gap: 10px;

            min-width: 0;

            padding: 6px 9px;

            border: 1px solid rgba(255,255,255,.065);

            border-radius: 17px;

            background: rgba(1,10,20,.4);
        }

        .user-avatar-wrap {
            position: relative;

            width: 45px;
            height: 45px;

            flex: 0 0 45px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid var(--gold);

            background: #10243b;

            box-shadow:
                0 0 0 3px rgba(245,184,61,.07);
        }

        .online-dot {
            position: absolute;

            width: 10px;
            height: 10px;

            left: 0;
            bottom: 1px;

            border-radius: 50%;

            background: var(--green);

            border: 2px solid #071321;
        }

        .user-details {
            min-width: 0;

            direction: rtl;
        }

        .user-name {
            max-width: 150px;

            color: #fff;

            font-size: 13px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id {
            margin-top: 2px;

            color: var(--muted);

            font-family: "Inter", monospace;

            font-size: 9px;

            direction: ltr;
        }

        /* BALANCE */

        .balance {
            display: flex;
            align-items: center;

            gap: 9px;

            min-width: 112px;

            padding: 8px 11px;

            border: 1px solid var(--border-gold);

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(245,184,61,.095),
                    rgba(245,184,61,.025)
                );
        }

        .balance-icon {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: var(--gold);

            background: rgba(245,184,61,.1);

            border: 1px solid rgba(245,184,61,.16);

            font-size: 16px;
        }

        .balance small {
            display: block;

            color: var(--muted);

            font-size: 9px;
            font-weight: 600;
        }

        .balance strong {
            display: block;

            margin-top: 1px;

            color: var(--gold-light);

            font-family: "Inter", sans-serif;

            font-size: 16px;
            font-weight: 900;

            direction: ltr;
        }

        /* LANGUAGE */

        .language-switch {
            position: absolute;

            top: 10px;
            left: 10px;

            z-index: 5;

            display: flex;
            align-items: center;

            gap: 3px;

            padding: 3px;

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 10px;

            background: rgba(2,10,18,.72);

            backdrop-filter: blur(10px);
        }

        .language-switch button {
            min-width: 31px;

            padding: 4px 7px;

            border: 0;

            border-radius: 7px;

            color: var(--muted);

            background: transparent;

            font-size: 9px;
            font-weight: 800;
        }

        .language-switch button.active {
            color: #071321;

            background: var(--gold);
        }

        /* HERO */

        .hero {
            position: relative;

            margin-top: 16px;

            min-height: 225px;

            display: flex;
            align-items: flex-end;

            padding: 28px;

            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 27px;

            background:
                linear-gradient(
                    115deg,
                    rgba(12,49,87,.97),
                    rgba(5,19,34,.98)
                );

            box-shadow: var(--shadow);
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            top: -210px;
            left: -80px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(40,147,239,.22),
                    transparent 68%
                );
        }

        .hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent 48%,
                    rgba(245,184,61,.05)
                );
        }

        .hero-content {
            position: relative;

            z-index: 2;

            max-width: 680px;
        }

        .hero-label {
            display: inline-flex;

            padding: 5px 10px;

            color: var(--gold);

            border: 1px solid rgba(245,184,61,.18);

            border-radius: 999px;

            background: rgba(245,184,61,.06);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.2px;

            direction: ltr;
        }

        .hero h1 {
            margin-top: 11px;

            color: #fff;

            font-size: clamp(27px, 5vw, 43px);

            line-height: 1.15;

            font-weight: 900;

            letter-spacing: -.8px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            max-width: 590px;

            margin-top: 10px;

            color: #91a7bf;

            font-size: 13px;

            line-height: 1.9;
        }

        /* PRODUCTS HEADER */

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 27px 3px 14px;
        }

        .section-title h2 {
            color: #fff;

            font-size: 20px;
            font-weight: 900;
        }

        .section-title h2::after {
            content: "";

            display: block;

            width: 32px;
            height: 3px;

            margin-top: 5px;

            border-radius: 99px;

            background: var(--gold);
        }

        .section-title span {
            color: var(--muted);

            font-size: 10px;

            padding: 6px 10px;

            border: 1px solid var(--border);

            border-radius: 999px;

            background: rgba(255,255,255,.025);
        }

        /* PRODUCTS */

        .products {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 15px;
        }

        /* Product cards generated by app.js */

        .product-card {
            position: relative;

            display: flex;
            flex-direction: column;

            min-width: 0;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(11,31,53,.98),
                    rgba(4,14,25,.98)
                );

            box-shadow:
                0 12px 35px rgba(0,0,0,.22);

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(245,184,61,.28);

            box-shadow:
                0 20px 45px rgba(0,0,0,.3);
        }

        .product-image {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 10;

            overflow: hidden;

            background: #071321;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform .35s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.045);
        }

        .product-image::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    transparent 55%,
                    rgba(0,0,0,.32)
                );

            pointer-events: none;
        }

        .product-content {
            display: flex;
            flex-direction: column;

            flex: 1;

            padding: 14px;
        }

        .product-name {
            color: #fff;

            font-size: 15px;
            font-weight: 850;

            line-height: 1.5;
        }

        .product-description {
            margin-top: 5px;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.7;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 14px;
        }

        .product-price {
            color: var(--gold-light);

            font-family: "Inter", sans-serif;

            font-size: 15px;
            font-weight: 900;

            direction: ltr;
            white-space: nowrap;
        }

        .buy-button {
            min-height: 38px;

            padding: 7px 13px;

            border: 1px solid rgba(245,184,61,.24);

            border-radius: 11px;

            color: #09111c;

            background:
                linear-gradient(
                    135deg,
                    #ffd86b,
                    #f5b83d
                );

            font-size: 11px;
            font-weight: 900;

            box-shadow:
                0 7px 18px rgba(245,184,61,.12);

            transition: .18s ease;
        }

        .buy-button:active {
            transform: scale(.96);
        }

        /* EMPTY */

        .empty-state {
            grid-column: 1 / -1;

            padding: 55px 20px;

            text-align: center;

            border: 1px dashed var(--border);

            border-radius: 22px;

            background: rgba(255,255,255,.015);
        }

        .empty-state-icon {
            margin-bottom: 10px;

            font-size: 30px;
        }

        .empty-state h3 {
            color: #fff;

            font-size: 15px;
            font-weight: 800;
        }

        .empty-state p {
            margin-top: 6px;

            color: var(--muted);

            font-size: 11px;
        }

        /* MODAL */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 15px;

            background: rgba(0,4,10,.78);

            backdrop-filter: blur(11px);
            -webkit-backdrop-filter: blur(11px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            position: relative;

            width: min(100%, 480px);

            max-height: 90vh;

            overflow: auto;

            padding: 25px;

            border: 1px solid var(--border);

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    #0a1c31,
                    #050e19
                );

            box-shadow:
                0 30px 90px rgba(0,0,0,.55);
        }

        .close {
            position: absolute;

            top: 12px;
            left: 12px;

            width: 34px;
            height: 34px;

            border: 1px solid var(--border);

            border-radius: 10px;

            color: #a9b9ca;

            background: rgba(255,255,255,.04);

            font-size: 21px;
        }

        /* TOAST */

        .toast {
            position: fixed;

            z-index: 2000;

            right: 50%;
            bottom: 22px;

            max-width: calc(100% - 30px);

            padding: 11px 16px;

            border: 1px solid var(--border-gold);

            border-radius: 13px;

            color: var(--white);

            background: rgba(6,18,32,.97);

            font-size: 11px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.4);

            opacity: 0;

            pointer-events: none;

            transform:
                translateX(50%)
                translateY(18px);

            transition: .25s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(50%)
                translateY(0);
        }

        /* MOBILE */

        @media (max-width: 760px) {

            .app {
                padding-left: 10px;
                padding-right: 10px;
            }

            .topbar {
                grid-template-columns: 1fr auto;

                gap: 10px;

                padding: 12px;
            }

            .brand-logo {
                width: 45px;
                height: 45px;

                flex-basis: 45px;
            }

            .brand {
                font-size: 15px;
            }

            .brand-subtitle {
                display: none;
            }

            .user-profile {
                grid-column: 1 / -1;

                width: 100%;

                justify-content: flex-start;
            }

            .user-details {
                flex: 1;
            }

            .user-name {
                max-width: none;
            }

            .balance {
                min-width: 105px;
            }

            .hero {
                min-height: 205px;

                padding: 23px 19px;

                border-radius: 22px;
            }

            .hero h1 {
                font-size: 29px;
            }

            .hero p {
                font-size: 12px;
            }

            .products {
                grid-template-columns:
                    repeat(2, minmax(0,1fr));

                gap: 9px;
            }

            .product-content {
                padding: 11px;
            }

            .product-name {
                font-size: 13px;
            }

            .product-description {
                font-size: 10px;
            }

            .product-footer {
                align-items: stretch;
                flex-direction: column;

                gap: 7px;
            }

            .buy-button {
                width: 100%;
            }
        }

        @media (max-width: 390px) {

            .products {
                grid-template-columns: 1fr;
            }

            .balance {
                min-width: 0;
            }

            .hero h1 {
                font-size: 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <!-- LANGUAGE -->

        <div class="language-switch">
            <button
                id="langAr"
                type="button"
                onclick="setLanguage('ar')"
            >
                AR
            </button>

            <button
                id="langEn"
                type="button"
                onclick="setLanguage('en')"
            >
                EN
            </button>
        </div>


        <!-- BRAND -->

        <div class="brand-area">

            <img
                class="brand-logo"
                src="https://i.imgur.com/Z8xh0Af.png"
                alt="Libyan Store"
            >

            <div class="brand-info">

                <div class="brand">
                    <span data-i18n="brandFirst">
                        المتجر
                    </span>

                    <span data-i18n="brandSecond">
                        الليبي
                    </span>
                </div>

                <div
                    class="brand-subtitle"
                    data-i18n="brandEnglish"
                >
                    LIBYAN STORE
                </div>

                <div
                    class="welcome"
                    id="welcome"
                >
                    جاري تحميل الحساب...
                </div>

            </div>

        </div>


        <!-- USER -->

        <div class="user-profile">

            <div class="user-avatar-wrap">

                <img
                    id="userAvatar"
                    class="user-avatar"
                    src="https://i.imgur.com/Z8xh0Af.png"
                    alt="User"
                >

                <span class="online-dot"></span>

            </div>

            <div class="user-details">

                <div
                    class="user-name"
                    id="userName"
                >
                    جاري التحميل...
                </div>

                <div
                    class="user-id"
                    id="userId"
                >
                    ID: ------
                </div>

            </div>

        </div>


        <!-- BALANCE -->

        <div class="balance">

            <div class="balance-icon">
                ⭐
            </div>

            <div>

                <small
                    id="balanceLabel"
                    data-i18n="balance"
                >
                    الرصيد
                </small>

                <strong id="balance">
                    0
                </strong>

            </div>

        </div>

    </header>


    <main>

        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">

                <span
                    class="hero-label"
                    data-i18n="heroLabel"
                >
                    LIBYAN STORE
                </span>

                <h1>

                    <span data-i18n="heroTitle">
                        خدماتك الرقمية
                    </span>

                    <br>

                    <span data-i18n="heroAccent">
                        بلمسة واحدة
                    </span>

                </h1>

                <p
                    id="heroDescription"
                    data-i18n="heroDescription"
                >
                    اختر الخدمة التي تريدها واستخدم رصيدك لإتمام طلبك بسهولة وسرعة.
                </p>

            </div>

        </section>


        <!-- PRODUCTS -->

        <div class="section-title">

            <h2 data-i18n="productsTitle">
                المنتجات
            </h2>

            <span id="productsCount">
                0
            </span>

        </div>

        <div
            class="products"
            id="products"
        ></div>

    </main>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <button
            class="close"
            type="button"
            onclick="closeModal()"
            aria-label="Close"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>
    const tg = window.Telegram?.WebApp;

    /*
     * اللغة:
     * يتم حفظها في الجهاز حتى بعد إغلاق المتجر.
     */

    const savedLanguage =
        localStorage.getItem("libyan_store_language") || "ar";

    window.currentLanguage = savedLanguage;


    const translations = {

        ar: {
            brandFirst: "المتجر",
            brandSecond: "الليبي",
            brandEnglish: "LIBYAN STORE",

            loadingAccount: "جاري تحميل الحساب...",
            telegramAccount: "حساب Telegram",
            openFromTelegram: "افتح المتجر من Telegram",
            telegramWebApp: "Telegram Web App",

            balance: "الرصيد",

            heroLabel: "المتجر الليبي",
            heroTitle: "خدماتك الرقمية",
            heroAccent: "بلمسة واحدة",
            heroDescription:
                "اختر الخدمة التي تريدها واستخدم رصيدك لإتمام طلبك بسهولة وسرعة.",

            productsTitle: "المنتجات",
            product: "منتج",
            products: "منتجات",

            emptyTitle: "لا توجد منتجات حالياً",
            emptyDescription: "سيتم إضافة المنتجات قريباً.",

            buy: "شراء",
            points: "نقطة",
            insufficientBalance: "الرصيد غير كافٍ",
            loading: "جاري التحميل..."
        },

        en: {
            brandFirst: "Libyan",
            brandSecond: "Store",
            brandEnglish: "LIBYAN STORE",

            loadingAccount: "Loading account...",
            telegramAccount: "Telegram account",
            openFromTelegram: "Open the store from Telegram",
            telegramWebApp: "Telegram Web App",

            balance: "Balance",

            heroLabel: "LIBYAN STORE",
            heroTitle: "Digital services",
            heroAccent: "in one tap",
            heroDescription:
                "Choose the service you need and use your balance to complete your order quickly and easily.",

            productsTitle: "Products",
            product: "Product",
            products: "Products",

            emptyTitle: "No products available",
            emptyDescription: "Products will be added soon.",

            buy: "Buy",
            points: "points",
            insufficientBalance: "Insufficient balance",
            loading: "Loading..."
        }
    };


    function t(key) {

        return (
            translations[window.currentLanguage]?.[key] ||
            translations.ar[key] ||
            key
        );
    }


    function setLanguage(language) {

        if (!translations[language]) {
            return;
        }

        window.currentLanguage = language;

        localStorage.setItem(
            "libyan_store_language",
            language
        );

        document.documentElement.lang =
            language;

        document.documentElement.dir =
            language === "ar"
                ? "rtl"
                : "ltr";

        document.title =
            language === "ar"
                ? "المتجر الليبي"
                : "Libyan Store";


        document
            .querySelectorAll("[data-i18n]")
            .forEach(element => {

                const key =
                    element.dataset.i18n;

                if (
                    Object.prototype.hasOwnProperty.call(
                        translations[language],
                        key
                    )
                ) {
                    element.textContent =
                        translations[language][key];
                }

            });


        const arButton =
            document.getElementById("langAr");

        const enButton =
            document.getElementById("langEn");


        arButton?.classList.toggle(
            "active",
            language === "ar"
        );

        enButton?.classList.toggle(
            "active",
            language === "en"
        );


        /*
         * تحديث النصوص التي قد يكون app.js
         * قد أنشأها سابقاً.
         */

        if (typeof window.renderProducts === "function") {
            window.renderProducts();
        }

        if (typeof window.updateProductCount === "function") {
            window.updateProductCount();
        }
    }


    /*
     * Telegram
     */

    if (tg) {

        tg.ready();

        tg.expand();

        try {

            tg.setHeaderColor("#071321");

            tg.setBackgroundColor("#030914");

        } catch (error) {

            console.log(
                "Telegram theme setup skipped"
            );

        }


        const telegramUser =
            tg.initDataUnsafe?.user;


        if (telegramUser) {

            const avatar =
                document.getElementById(
                    "userAvatar"
                );

            const userName =
                document.getElementById(
                    "userName"
                );

            const userId =
                document.getElementById(
                    "userId"
                );

            const welcome =
                document.getElementById(
                    "welcome"
                );


            if (telegramUser.photo_url) {

                avatar.src =
                    telegramUser.photo_url;

            }


            const fullName =
                [
                    telegramUser.first_name || "",
                    telegramUser.last_name || ""
                ]
                .join(" ")
                .trim();


            userName.textContent =
                fullName ||
                telegramUser.username ||
                "Telegram User";


            userId.textContent =
                `ID: ${telegramUser.id}`;


            welcome.textContent =
                telegramUser.username
                    ? `@${telegramUser.username}`
                    : t("telegramAccount");


        } else {

            document.getElementById(
                "userName"
            ).textContent =
                t("openFromTelegram");

            document.getElementById(
                "userId"
            ).textContent =
                t("telegramWebApp");

            document.getElementById(
                "welcome"
            ).textContent =
                t("openFromTelegram");
        }

    }


    /*
     * تطبيق اللغة المحفوظة بعد تجهيز DOM.
     */

    setLanguage(
        window.currentLanguage
    );
</script>


<script src="/app.js"></script>

</body>
</html>
