<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#06111f">

    <title>المتجر الليبي | Libyan Store</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #030914;
            --bg-2: #06111f;
            --panel: #081727;
            --panel-2: #0b1d31;

            --blue: #1684e8;
            --blue-light: #42a5ff;

            --gold: #f5b83d;
            --gold-light: #ffd86b;

            --text: #eef6ff;
            --muted: #8296ad;
            --muted-2: #61758c;

            --green: #62e59a;
            --red: #ff6868;

            --border: rgba(104, 165, 220, .14);
            --border-light: rgba(255, 255, 255, .065);
            --border-gold: rgba(245, 184, 61, .25);

            --radius: 20px;

            --shadow:
                0 20px 60px rgba(0, 0, 0, .30);
        }


        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }


        html {
            min-height: 100%;
            background: var(--bg);

            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;
            min-height: 100dvh;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 85% -10%,
                    rgba(22, 132, 232, .15),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 0% 45%,
                    rgba(245, 184, 61, .035),
                    transparent 28%
                ),
                linear-gradient(
                    145deg,
                    #030914 0%,
                    #06111f 48%,
                    #07182a 100%
                );

            font-family:
                "Cairo",
                system-ui,
                sans-serif;

            overflow-x: hidden;
        }


        html[lang="en"] body {
            font-family:
                "Inter",
                system-ui,
                sans-serif;
        }


        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            border: 0;
            cursor: pointer;
        }


        img {
            max-width: 100%;
        }


        ::selection {
            color: #071321;
            background: var(--gold);
        }


        /* ================================
           APP
        ================================= */

        .app {
            width: 100%;
            max-width: 1240px;

            margin: 0 auto;

            padding:
                max(12px, env(safe-area-inset-top))
                16px
                max(30px, env(safe-area-inset-bottom));
        }


        /* ================================
           HEADER
        ================================= */

        .topbar {
            position: relative;

            display: grid;

            grid-template-columns: 1fr auto auto;

            align-items: center;

            gap: 14px;

            min-height: 78px;

            padding: 12px 14px;

            border: 1px solid var(--border);

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(12, 33, 56, .96),
                    rgba(5, 15, 27, .98)
                );

            box-shadow: var(--shadow);

            overflow: hidden;
        }


        .topbar::before {
            content: "";

            position: absolute;

            top: 0;
            left: 12%;
            right: 12%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(245, 184, 61, .7),
                    transparent
                );
        }


        .topbar::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -170px;
            right: -80px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(22, 132, 232, .12),
                    transparent 70%
                );

            pointer-events: none;
        }


        /* ================================
           BRAND
        ================================= */

        .brand-area {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .brand-logo {
            width: 49px;
            height: 49px;

            flex: 0 0 49px;

            display: block;

            object-fit: cover;

            border-radius: 14px;

            border: 1px solid var(--border-gold);

            background: #071321;

            box-shadow:
                0 0 0 4px rgba(245, 184, 61, .035),
                0 9px 25px rgba(0, 0, 0, .28);
        }


        .brand-info {
            min-width: 0;
        }


        .brand {
            color: #fff;

            font-size: 17px;
            font-weight: 900;

            line-height: 1.25;

            white-space: nowrap;
        }


        .brand span {
            color: var(--gold);
        }


        .brand span:first-child {
            color: #fff;
        }


        .brand-subtitle {
            margin-top: 3px;

            color: var(--muted);

            font-family: "Inter", sans-serif;

            font-size: 8px;
            font-weight: 800;

            letter-spacing: 1.5px;

            direction: ltr;
        }


        .welcome {
            margin-top: 3px;

            color: var(--muted-2);

            font-size: 9px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* ================================
           USER
        ================================= */

        .user-profile {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;

            gap: 9px;

            min-width: 145px;

            padding: 6px 8px;

            border: 1px solid var(--border-light);

            border-radius: 15px;

            background: rgba(0, 7, 15, .30);
        }


        .user-avatar-wrap {
            position: relative;

            width: 41px;
            height: 41px;

            flex: 0 0 41px;
        }


        .user-avatar {
            width: 41px;
            height: 41px;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid var(--gold);

            background: #10243b;

            box-shadow:
                0 0 0 3px rgba(245, 184, 61, .055);
        }


        .online-dot {
            position: absolute;

            width: 9px;
            height: 9px;

            left: -1px;
            bottom: 0;

            border-radius: 50%;

            background: var(--green);

            border: 2px solid #071321;
        }


        .user-details {
            min-width: 0;
        }


        .user-name {
            max-width: 145px;

            color: #fff;

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .user-id {
            margin-top: 2px;

            color: var(--muted-2);

            font-family: "Inter", monospace;

            font-size: 8px;

            direction: ltr;
        }


        /* ================================
           BALANCE
        ================================= */

        .balance {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;

            gap: 8px;

            min-width: 120px;

            padding: 8px 10px;

            border: 1px solid var(--border-gold);

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(245, 184, 61, .09),
                    rgba(245, 184, 61, .025)
                );
        }


        .balance-icon {
            width: 33px;
            height: 33px;

            display: grid;
            place-items: center;

            flex: 0 0 33px;

            border-radius: 10px;

            color: var(--gold);

            background: rgba(245, 184, 61, .09);

            border: 1px solid rgba(245, 184, 61, .13);

            font-size: 14px;
        }


        .balance small {
            display: block;

            color: var(--muted);

            font-size: 8px;
            font-weight: 700;
        }


        .balance strong {
            display: block;

            margin-top: 1px;

            color: var(--gold-light);

            font-family: "Inter", sans-serif;

            font-size: 15px;
            font-weight: 900;

            line-height: 1.2;

            direction: ltr;
        }


        /* ================================
           LANGUAGE
        ================================= */

        .language-switch {
            position: absolute;

            top: 9px;
            left: 9px;

            z-index: 20;

            display: flex;
            align-items: center;

            gap: 2px;

            padding: 3px;

            border: 1px solid rgba(255, 255, 255, .07);

            border-radius: 9px;

            background: rgba(1, 8, 16, .72);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }


        .language-switch button {
            min-width: 29px;

            padding: 4px 6px;

            border-radius: 6px;

            color: var(--muted);

            background: transparent;

            font-family: "Inter", sans-serif;

            font-size: 8px;
            font-weight: 900;

            transition: .18s ease;
        }


        .language-switch button:hover {
            color: #fff;
        }


        .language-switch button.active {
            color: #08111c;

            background: var(--gold);
        }


        /* ================================
           STORE HEADER
        ================================= */

        .store-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-top: 25px;

            padding: 0 3px;
        }


        .store-heading {
            min-width: 0;
        }


        .store-eyebrow {
            display: inline-flex;
            align-items: center;

            gap: 7px;

            color: var(--gold);

            font-family: "Inter", sans-serif;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 1.5px;

            direction: ltr;
        }


        .store-eyebrow::before {
            content: "";

            width: 24px;
            height: 2px;

            border-radius: 99px;

            background: var(--gold);
        }


        .store-title {
            margin-top: 7px;

            color: #fff;

            font-size: clamp(24px, 4vw, 34px);

            font-weight: 900;

            line-height: 1.2;

            letter-spacing: -.5px;
        }


        .store-title span {
            color: var(--gold);
        }


        .store-caption {
            margin-top: 6px;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.7;
        }


        /* ================================
           PRODUCTS HEADER
        ================================= */

        .products-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 25px;
            margin-bottom: 13px;

            padding: 0 3px;
        }


        .products-heading-left {
            display: flex;
            align-items: center;

            gap: 9px;
        }


        .products-heading-marker {
            width: 4px;
            height: 22px;

            border-radius: 99px;

            background:
                linear-gradient(
                    180deg,
                    var(--gold-light),
                    var(--gold)
                );

            box-shadow:
                0 0 14px rgba(245, 184, 61, .16);
        }


        .products-heading h2 {
            color: #fff;

            font-size: 17px;
            font-weight: 900;
        }


        .products-count {
            min-width: 34px;

            padding: 5px 9px;

            text-align: center;

            color: var(--muted);

            border: 1px solid var(--border);

            border-radius: 999px;

            background: rgba(255, 255, 255, .025);

            font-family: "Inter", sans-serif;

            font-size: 9px;
            font-weight: 800;
        }


        /* ================================
           PRODUCTS
        ================================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(225px, 1fr)
                );

            gap: 15px;
        }


        /* ================================
           PRODUCT CARD
        ================================= */

        .product-card {
            position: relative;

            display: flex;
            flex-direction: column;

            min-width: 0;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 30, 51, .98),
                    rgba(4, 13, 24, .99)
                );

            box-shadow:
                0 12px 35px rgba(0, 0, 0, .20);

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }


        .product-card:hover {
            transform: translateY(-4px);

            border-color:
                rgba(245, 184, 61, .27);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .30);
        }


        .product-image {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 10;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #0b2036,
                    #06111f
                );
        }


        .product-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform .35s ease;
        }


        .product-card:hover
        .product-image img {
            transform: scale(1.045);
        }


        .product-image::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    transparent 45%,
                    rgba(0, 0, 0, .30)
                );

            pointer-events: none;
        }


        .product-content {
            display: flex;
            flex-direction: column;

            flex: 1;

            padding: 13px;
        }


        .product-name {
            color: #fff;

            font-size: 14px;
            font-weight: 900;

            line-height: 1.45;
        }


        .product-description {
            min-height: 35px;

            margin-top: 5px;

            color: var(--muted);

            font-size: 10px;

            line-height: 1.75;

            display: -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            margin-top: 13px;
        }


        .product-price {
            color: var(--gold-light);

            font-family: "Inter", sans-serif;

            font-size: 14px;
            font-weight: 900;

            direction: ltr;

            white-space: nowrap;
        }


        .buy-button {
            min-height: 36px;

            padding: 6px 14px;

            border: 1px solid rgba(245, 184, 61, .25);

            border-radius: 10px;

            color: #071321;

            background:
                linear-gradient(
                    135deg,
                    #ffd86b,
                    #f5b83d
                );

            font-size: 10px;
            font-weight: 900;

            box-shadow:
                0 7px 20px rgba(245, 184, 61, .10);

            transition:
                transform .16s ease,
                filter .16s ease;
        }


        .buy-button:hover {
            filter: brightness(1.05);
        }


        .buy-button:active {
            transform: scale(.95);
        }


        /* ================================
           EMPTY STATE
        ================================= */

        .empty-state {
            grid-column: 1 / -1;

            padding: 65px 20px;

            text-align: center;

            border: 1px dashed var(--border);

            border-radius: 20px;

            background:
                rgba(255, 255, 255, .012);
        }


        .empty-state-icon {
            margin-bottom: 9px;

            font-size: 28px;

            opacity: .8;
        }


        .empty-state h3 {
            color: #fff;

            font-size: 14px;
            font-weight: 800;
        }


        .empty-state p {
            margin-top: 5px;

            color: var(--muted);

            font-size: 10px;
        }


        /* ================================
           MODAL
        ================================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 15px;

            background:
                rgba(0, 4, 10, .78);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }


        .modal.active {
            display: flex;
        }


        .modal-box {
            position: relative;

            width: min(100%, 460px);

            max-height: 90vh;

            overflow-y: auto;

            padding: 25px;

            border: 1px solid var(--border);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #0a1c31,
                    #050e19
                );

            box-shadow:
                0 30px 90px rgba(0, 0, 0, .55);

            animation:
                modalIn .2s ease;
        }


        @keyframes modalIn {

            from {
                opacity: 0;
                transform: translateY(10px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        .close {
            position: absolute;

            top: 11px;
            left: 11px;

            width: 33px;
            height: 33px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);

            border-radius: 9px;

            color: #a9b9ca;

            background:
                rgba(255, 255, 255, .04);

            font-size: 20px;

            transition: .16s ease;
        }


        .close:hover {
            color: #fff;
            background: rgba(255, 255, 255, .08);
        }


        /* ================================
           TOAST
        ================================= */

        .toast {
            position: fixed;

            z-index: 2000;

            right: 50%;
            bottom: 20px;

            max-width: calc(100% - 28px);

            padding: 10px 15px;

            border: 1px solid var(--border-gold);

            border-radius: 12px;

            color: var(--text);

            background:
                rgba(6, 18, 32, .97);

            font-size: 10px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .40);

            opacity: 0;

            pointer-events: none;

            transform:
                translateX(50%)
                translateY(15px);

            transition: .23s ease;
        }


        .toast.show {
            opacity: 1;

            transform:
                translateX(50%)
                translateY(0);
        }


        /* ================================
           DESKTOP
        ================================= */

        @media (min-width: 1000px) {

            .app {
                padding-left: 20px;
                padding-right: 20px;
            }


            .topbar {
                min-height: 82px;
            }


            .products {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }

        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 850px) {

            .topbar {
                grid-template-columns:
                    1fr auto;

                gap: 10px;
            }


            .user-profile {
                grid-column: 1 / -1;

                width: 100%;
            }


            .user-details {
                flex: 1;
            }


            .user-name {
                max-width: none;
            }


            .balance {
                min-width: 110px;
            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .app {
                padding-left: 10px;
                padding-right: 10px;
            }


            .topbar {
                padding: 11px;

                border-radius: 19px;
            }


            .brand-logo {
                width: 44px;
                height: 44px;

                flex-basis: 44px;

                border-radius: 13px;
            }


            .brand {
                font-size: 14px;
            }


            .brand-subtitle {
                display: none;
            }


            .welcome {
                font-size: 8px;
            }


            .balance {
                min-width: 105px;

                padding: 7px 8px;
            }


            .balance-icon {
                width: 30px;
                height: 30px;

                flex-basis: 30px;
            }


            .balance strong {
                font-size: 14px;
            }


            .store-header {
                margin-top: 21px;
            }


            .store-title {
                font-size: 24px;
            }


            .store-caption {
                font-size: 10px;
            }


            .products-heading {
                margin-top: 22px;
            }


            .products {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 9px;
            }


            .product-card {
                border-radius: 15px;
            }


            .product-content {
                padding: 10px;
            }


            .product-name {
                font-size: 12px;
            }


            .product-description {
                min-height: 32px;

                font-size: 9px;
            }


            .product-footer {
                align-items: stretch;

                flex-direction: column;

                gap: 7px;

                margin-top: 10px;
            }


            .product-price {
                font-size: 12px;
            }


            .buy-button {
                width: 100%;

                min-height: 34px;
            }

        }


        /* ================================
           SMALL MOBILE
        ================================= */

        @media (max-width: 390px) {

            .topbar {
                grid-template-columns: 1fr;
            }


            .balance {
                width: 100%;
            }


            .products {
                grid-template-columns: 1fr;
            }


            .product-footer {
                flex-direction: row;

                align-items: center;
            }


            .buy-button {
                width: auto;
            }


            .store-title {
                font-size: 22px;
            }

        }


        /* ================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;

                transition: none !important;

                animation: none !important;
            }

        }

    </style>
</head>


<body>

<div class="app">

    <!-- =================================
         TOP BAR
    ================================= -->

    <header class="topbar">

        <!-- LANGUAGE -->

        <div class="language-switch">

            <button
                id="langAr"
                type="button"
                onclick="setLanguage('ar')"
            >
                AR
            </button>

            <button
                id="langEn"
                type="button"
                onclick="setLanguage('en')"
            >
                EN
            </button>

        </div>


        <!-- BRAND -->

        <div class="brand-area">

            <img
                class="brand-logo"
                src="https://i.imgur.com/Z8xh0Af.png"
                alt="Libyan Store"
            >

            <div class="brand-info">

                <div class="brand">

                    <span data-i18n="brandFirst">
                        المتجر
                    </span>

                    <span data-i18n="brandSecond">
                        الليبي
                    </span>

                </div>


                <div
                    class="brand-subtitle"
                    data-i18n="brandEnglish"
                >
                    LIBYAN STORE
                </div>


                <div
                    class="welcome"
                    id="welcome"
                >
                    جاري تحميل الحساب...
                </div>

            </div>

        </div>


        <!-- USER -->

        <div class="user-profile">

            <div class="user-avatar-wrap">

                <img
                    id="userAvatar"
                    class="user-avatar"
                    src="https://i.imgur.com/Z8xh0Af.png"
                    alt="User"
                >

                <span class="online-dot"></span>

            </div>


            <div class="user-details">

                <div
                    class="user-name"
                    id="userName"
                >
                    جاري التحميل...
                </div>


                <div
                    class="user-id"
                    id="userId"
                >
                    ID: ------
                </div>

            </div>

        </div>


        <!-- BALANCE -->

        <div class="balance">

            <div class="balance-icon">
                ⭐
            </div>


            <div>

                <small
                    id="balanceLabel"
                    data-i18n="balance"
                >
                    الرصيد
                </small>


                <strong id="balance">
                    0
                </strong>

            </div>

        </div>

    </header>


    <!-- =================================
         STORE HEADER
    ================================= -->

    <main>

        <section class="store-header">

            <div class="store-heading">

                <div
                    class="store-eyebrow"
                    data-i18n="storeEyebrow"
                >
                    LIBYAN STORE
                </div>


                <h1
                    class="store-title"
                    data-i18n="storeTitle"
                >
                    المتجر <span>الليبي</span>
                </h1>


                <p
                    class="store-caption"
                    data-i18n="storeCaption"
                >
                    اختر منتجاتك واطلبها مباشرة باستخدام رصيدك.
                </p>

            </div>

        </section>


        <!-- =================================
             PRODUCTS HEADER
        ================================= -->

        <div class="products-heading">

            <div class="products-heading-left">

                <span class="products-heading-marker"></span>

                <h2 data-i18n="productsTitle">
                    المنتجات
                </h2>

            </div>


            <span
                class="products-count"
                id="productsCount"
            >
                0
            </span>

        </div>


        <!-- =================================
             PRODUCTS
        ================================= -->

        <div
            class="products"
            id="products"
        ></div>

    </main>

</div>


<!-- =================================
     MODAL
================================= -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <button
            class="close"
            type="button"
            onclick="closeModal()"
            aria-label="Close"
        >
            ×
        </button>


        <div id="modalContent"></div>

    </div>

</div>


<!-- =================================
     TOAST
================================= -->

<div
    class="toast"
    id="toast"
></div>


<script>

    /* =================================
       TELEGRAM
    ================================= */

    const tg =
        window.Telegram?.WebApp;


    /* =================================
       LANGUAGE
    ================================= */

    const savedLanguage =
        localStorage.getItem(
            "libyan_store_language"
        ) || "ar";


    window.currentLanguage =
        savedLanguage;


    const translations = {

        ar: {

            brandFirst: "المتجر",
            brandSecond: "الليبي",
            brandEnglish: "LIBYAN STORE",

            loadingAccount:
                "جاري تحميل الحساب...",

            telegramAccount:
                "حساب Telegram",

            openFromTelegram:
                "افتح المتجر من Telegram",

            telegramWebApp:
                "Telegram Web App",

            balance:
                "الرصيد",

            storeEyebrow:
                "LIBYAN STORE",

            storeTitle:
                "المتجر <span>الليبي</span>",

            storeCaption:
                "اختر منتجاتك واطلبها مباشرة باستخدام رصيدك.",

            productsTitle:
                "المنتجات",

            product:
                "منتج",

            products:
                "منتجات",

            emptyTitle:
                "لا توجد منتجات حالياً",

            emptyDescription:
                "سيتم إضافة المنتجات قريباً.",

            buy:
                "شراء",

            points:
                "نقطة",

            insufficientBalance:
                "الرصيد غير كافٍ",

            loading:
                "جاري التحميل..."

        },


        en: {

            brandFirst:
                "Libyan",

            brandSecond:
                "Store",

            brandEnglish:
                "LIBYAN STORE",

            loadingAccount:
                "Loading account...",

            telegramAccount:
                "Telegram account",

            openFromTelegram:
                "Open the store from Telegram",

            telegramWebApp:
                "Telegram Web App",

            balance:
                "Balance",

            storeEyebrow:
                "LIBYAN STORE",

            storeTitle:
                "Libyan <span>Store</span>",

            storeCaption:
                "Choose your products and place your order using your balance.",

            productsTitle:
                "Products",

            product:
                "Product",

            products:
                "Products",

            emptyTitle:
                "No products available",

            emptyDescription:
                "Products will be added soon.",

            buy:
                "Buy",

            points:
                "points",

            insufficientBalance:
                "Insufficient balance",

            loading:
                "Loading..."

        }

    };


    function t(key) {

        return (
            translations[
                window.currentLanguage
            ]?.[key] ||

            translations.ar[key] ||

            key
        );

    }


    /* =================================
       LANGUAGE SWITCH
    ================================= */

    function setLanguage(language) {

        if (!translations[language]) {
            return;
        }


        window.currentLanguage =
            language;


        localStorage.setItem(
            "libyan_store_language",
            language
        );


        document.documentElement.lang =
            language;


        document.documentElement.dir =
            language === "ar"
                ? "rtl"
                : "ltr";


        document.title =
            language === "ar"
                ? "المتجر الليبي"
                : "Libyan Store";


        /*
         * العناصر العادية
         */

        document
            .querySelectorAll("[data-i18n]")
            .forEach(element => {

                const key =
                    element.dataset.i18n;


                if (
                    Object.prototype.hasOwnProperty.call(
                        translations[language],
                        key
                    )
                ) {

                    /*
                     * storeTitle يحتوي على HTML
                     */

                    if (key === "storeTitle") {

                        element.innerHTML =
                            translations[
                                language
                            ][key];

                    } else {

                        element.textContent =
                            translations[
                                language
                            ][key];

                    }

                }

            });


        /*
         * أزرار اللغة
         */

        document
            .getElementById("langAr")
            ?.classList.toggle(
                "active",
                language === "ar"
            );


        document
            .getElementById("langEn")
            ?.classList.toggle(
                "active",
                language === "en"
            );


        /*
         * إعادة رسم المنتجات
         * بعد تغيير اللغة.
         */

        if (
            typeof window.renderProducts ===
            "function"
        ) {

            window.renderProducts();

        }


        if (
            typeof window.updateProductCount ===
            "function"
        ) {

            window.updateProductCount();

        }

    }


    /* =================================
       TELEGRAM INITIALIZATION
    ================================= */

    if (tg) {

        tg.ready();

        tg.expand();


        try {

            tg.setHeaderColor(
                "#06111f"
            );

            tg.setBackgroundColor(
                "#030914"
            );

        } catch (error) {

            console.log(
                "Telegram theme setup skipped"
            );

        }


        const telegramUser =
            tg.initDataUnsafe?.user;


        if (telegramUser) {

            const avatar =
                document.getElementById(
                    "userAvatar"
                );


            const userName =
                document.getElementById(
                    "userName"
                );


            const userId =
                document.getElementById(
                    "userId"
                );


            const welcome =
                document.getElementById(
                    "welcome"
                );


            if (
                telegramUser.photo_url
            ) {

                avatar.src =
                    telegramUser.photo_url;

            }


            const fullName =
                [
                    telegramUser.first_name || "",
                    telegramUser.last_name || ""
                ]
                .join(" ")
                .trim();


            userName.textContent =
                fullName ||

                telegramUser.username ||

                "Telegram User";


            userId.textContent =
                `ID: ${telegramUser.id}`;


            welcome.textContent =
                telegramUser.username
                    ? `@${telegramUser.username}`
                    : t("telegramAccount");

        } else {

            document.getElementById(
                "userName"
            ).textContent =
                t("openFromTelegram");


            document.getElementById(
                "userId"
            ).textContent =
                t("telegramWebApp");


            document.getElementById(
                "welcome"
            ).textContent =
                t("openFromTelegram");

        }

    }


    /* =================================
       APPLY SAVED LANGUAGE
    ================================= */

    setLanguage(
        window.currentLanguage
    );

</script>


<script src="/app.js"></script>

</body>

</html>
