<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <title>المتجر الليبي</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Telegram Web App -->
  <script
    src="https://telegram.org/js/telegram-web-app.js"
  ></script>

  <!-- Lucide Icons -->
  <script
    src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"
    defer
  ></script>

  <style>

    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {

      --page-bg: #08111f;

      --surface: #0d1b2d;

      --surface-raised: #12243a;

      --surface-soft: #152a43;

      --line:
        rgba(176, 202, 226, 0.14);

      --line-strong:
        rgba(213, 173, 88, 0.32);

      --text: #f5f0e8;

      --muted: #9eb0c4;

      --faint: #71869d;

      --gold: #d5ad58;

      --gold-light: #f2d28c;

      --blue: #4ca3e6;

      --blue-soft: #77c5fb;

      --success: #72d2a2;

      --danger: #ff8d8d;

      --warning: #f5b25c;

      --shadow:
        0 24px 60px rgba(0, 0, 0, 0.34);

      --radius-lg: 24px;

      --radius-md: 16px;

      --safe-top:
        env(safe-area-inset-top, 0px);

      --safe-bottom:
        env(safe-area-inset-bottom, 0px);
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }


    html {

      background:
        var(--page-bg);

      -webkit-tap-highlight-color:
        transparent;

      scroll-behavior:
        smooth;
    }


    body {

      width: 100%;

      min-height: 100vh;

      min-height: 100dvh;

      margin: 0;

      overflow-x: hidden;

      color: var(--text);

      background:

        radial-gradient(
          circle at 92% 2%,
          rgba(76, 163, 230, 0.16),
          transparent 26rem
        ),

        radial-gradient(
          circle at 7% 20%,
          rgba(213, 173, 88, 0.1),
          transparent 24rem
        ),

        var(--page-bg);

      font-family:
        "Cairo",
        Tahoma,
        sans-serif;

      text-align: right;
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    button:disabled {
      cursor: not-allowed;

      opacity: 0.5;

      filter:
        grayscale(0.25);
    }


    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {

      outline:
        3px solid
        var(--gold-light);

      outline-offset:
        3px;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .store-shell {

      width: 100%;

      max-width: 1180px;

      margin: 0 auto;

      padding:
        calc(18px + var(--safe-top))
        clamp(16px, 4vw, 34px)
        calc(32px + var(--safe-bottom));
    }


    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto;

      gap: 18px;

      align-items: center;

      padding: 16px 18px;

      border:
        1px solid
        var(--line);

      border-radius:
        var(--radius-lg);

      background:
        rgba(13, 27, 45, 0.82);

      box-shadow:
        0 12px 38px
        rgba(0, 0, 0, 0.16);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      animation:
        reveal 500ms ease both;
    }


    .brand-user {

      display: flex;

      align-items: center;

      min-width: 0;

      gap: 13px;
    }


    .brand-mark {

      display: grid;

      flex: 0 0 auto;

      width: 45px;

      height: 45px;

      place-items: center;

      border:
        1px solid
        rgba(242, 210, 140, 0.45);

      border-radius: 14px;

      color: #0b1727;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      box-shadow:
        0 8px 20px
        rgba(213, 173, 88, 0.2);

      font-size: 1.28rem;

      font-weight: 800;
    }


    .brand-copy {
      min-width: 0;
    }


    .brand-name {

      margin: 0;

      color:
        var(--gold-light);

      font-size: 1rem;

      font-weight: 800;

      line-height: 1.25;
    }


    .brand-caption {

      margin: 3px 0 0;

      color: var(--muted);

      font-size: 0.72rem;

      font-weight: 600;
    }


    /* =====================================================
       USER
    ===================================================== */

    .user-summary {

      display: flex;

      align-items: center;

      min-width: 0;

      gap: 10px;
    }


    .avatar-frame {

      display: grid;

      flex: 0 0 auto;

      width: 42px;

      height: 42px;

      overflow: hidden;

      place-items: center;

      border:
        1px solid
        rgba(119, 197, 251, 0.4);

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #1d4d73,
          #10283e
        );

      color:
        var(--blue-soft);

      font-size: 0.9rem;

      font-weight: 800;
    }


    #userAvatar {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;
    }


    .user-details {

      min-width: 0;

      line-height: 1.2;
    }


    #userName {

      overflow: hidden;

      margin: 0;

      color: var(--text);

      font-size: 0.83rem;

      font-weight: 700;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    #userId {

      display: block;

      overflow: hidden;

      margin-top: 3px;

      color: var(--faint);

      direction: ltr;

      font-size: 0.68rem;

      text-align: right;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    /* =====================================================
       BALANCE
    ===================================================== */

    .balance-card {

      min-width: 112px;

      padding: 9px 12px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(213, 173, 88, 0.14),
          rgba(213, 173, 88, 0.04)
        );
    }


    .balance-label {

      display: block;

      color:
        var(--gold-light);

      font-size: 0.66rem;

      font-weight: 700;
    }


    #balance {

      display: block;

      margin-top: 2px;

      direction: ltr;

      color: var(--text);

      font-size: 0.95rem;

      font-weight: 800;

      text-align: right;

      unicode-bidi: plaintext;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      position: relative;

      overflow: hidden;

      margin-top: 24px;

      padding:
        clamp(25px, 5vw, 46px);

      border:
        1px solid
        rgba(119, 197, 251, 0.18);

      border-radius:
        var(--radius-lg);

      background:
        linear-gradient(
          110deg,
          rgba(18, 46, 72, 0.96),
          rgba(13, 27, 45, 0.93) 58%,
          rgba(90, 65, 24, 0.54)
        );

      box-shadow:
        var(--shadow);

      animation:
        reveal 580ms 90ms ease both;
    }


    .hero::after {

      position: absolute;

      top: -110px;

      left: -72px;

      width: 285px;

      height: 285px;

      border:
        1px solid
        rgba(242, 210, 140, 0.18);

      border-radius: 50%;

      box-shadow:

        0 0 0 28px
        rgba(242, 210, 140, 0.035),

        0 0 0 58px
        rgba(242, 210, 140, 0.02);

      content: "";

      pointer-events: none;
    }


    .hero-content {

      position: relative;

      z-index: 1;

      max-width: 670px;
    }


    .eyebrow {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 11px;

      color:
        var(--gold-light);

      font-size: 0.76rem;

      font-weight: 800;
    }


    .eyebrow::before {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background:
        var(--gold);

      box-shadow:
        0 0 14px
        var(--gold);

      content: "";
    }


    #welcome {

      max-width: 660px;

      margin: 0;

      color: var(--text);

      font-size:
        clamp(
          1.5rem,
          4vw,
          2.45rem
        );

      font-weight: 800;

      line-height: 1.42;

      letter-spacing:
        -0.025em;
    }


    .hero-description {

      max-width: 560px;

      margin: 12px 0 0;

      color: #bed0e0;

      font-size:
        clamp(
          0.82rem,
          2vw,
          0.98rem
        );

      font-weight: 500;

      line-height: 2;
    }


    /* =====================================================
       PRODUCTS
    ===================================================== */

    .products-section {

      margin-top: 30px;

      animation:
        reveal 620ms 160ms ease both;
    }


    .section-heading {

      display: flex;

      align-items: end;

      justify-content: space-between;

      gap: 14px;

      margin-bottom: 15px;

      padding: 0 3px;
    }


    .section-title-wrap {

      display: flex;

      align-items: center;

      gap: 9px;
    }


    .section-title-wrap::before {

      width: 4px;

      height: 27px;

      border-radius: 8px;

      background:
        linear-gradient(
          to bottom,
          var(--gold-light),
          var(--gold)
        );

      content: "";
    }


    .section-title {

      margin: 0;

      color: var(--text);

      font-size:
        clamp(
          1.1rem,
          3vw,
          1.36rem
        );

      font-weight: 800;
    }


    .count-badge {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      min-height: 31px;

      padding: 5px 11px;

      border:
        1px solid
        rgba(76, 163, 230, 0.24);

      border-radius: 999px;

      background:
        rgba(76, 163, 230, 0.09);

      color:
        var(--blue-soft);

      font-size: 0.72rem;

      font-weight: 700;

      white-space: nowrap;
    }


    #productsCount {

      direction: ltr;

      font-weight: 800;

      unicode-bidi: plaintext;
    }


    #products {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(
            min(100%, 228px),
            1fr
          )
        );

      gap: 15px;

      min-height: 120px;
    }


    /* =====================================================
       PRODUCT CARD
    ===================================================== */

    .product-card {

      position: relative;

      display: flex;

      flex-direction: column;

      min-width: 0;

      overflow: hidden;

      padding: 15px;

      border:
        1px solid
        var(--line);

      border-radius:
        var(--radius-md);

      color: var(--text);

      background:
        linear-gradient(
          160deg,
          rgba(21, 42, 67, 0.92),
          rgba(13, 27, 45, 0.95)
        );

      box-shadow:
        0 12px 26px
        rgba(0, 0, 0, 0.18);

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }


    .product-card:hover {

      transform:
        translateY(-4px);

      border-color:
        rgba(213, 173, 88, 0.5);

      box-shadow:
        0 18px 32px
        rgba(0, 0, 0, 0.27);
    }


    .product-image-wrap {

      position: relative;

      width: calc(100% + 30px);

      height: auto;

      min-height: 145px;

      margin:
        -15px
        -15px
        14px;

      overflow: hidden;

      border-bottom:
        1px solid
        var(--line);

      background:
        var(--surface-soft);
    }


    .product-image {

      display: block;

      width: 100%;

      height: 145px;

      margin: 0 !important;

      border: 0 !important;

      object-fit: cover;

      background:
        var(--surface-soft);
    }


    .product-image-placeholder {

      display: grid;

      width: 100%;

      height: 145px;

      place-items: center;

      color:
        var(--gold-light);

      background:
        linear-gradient(
          145deg,
          rgba(213, 173, 88, 0.12),
          rgba(13, 27, 45, 0.5)
        );

      font-size: 2rem;
    }


    .product-content {

      display: flex;

      flex: 1;

      flex-direction: column;

      min-width: 0;
    }


    .product-top {

      display: flex;

      flex-direction: column;

      gap: 9px;
    }


    .product-name {

      margin: 0;

      color:
        var(--text);

      font-size: 1rem;

      font-weight: 800;

      line-height: 1.55;
    }


    .product-description {

      display: -webkit-box;

      overflow: hidden;

      margin: 8px 0 15px;

      color:
        var(--muted);

      font-size: 0.76rem;

      line-height: 1.8;

      -webkit-line-clamp: 3;

      -webkit-box-orient: vertical;
    }


    /* =====================================================
       DELIVERY BADGE
    ===================================================== */

    .product-delivery-badge {

      display: inline-flex;

      align-items: center;

      align-self: flex-start;

      gap: 5px;

      width: fit-content;

      padding: 4px 8px;

      border-radius: 999px;

      font-size: 0.65rem;

      font-weight: 800;

      line-height: 1.4;
    }


    .product-delivery-badge.code {

      border:
        1px solid
        rgba(114, 210, 162, 0.3);

      color:
        var(--success);

      background:
        rgba(114, 210, 162, 0.08);
    }


    .product-delivery-badge.manual {

      border:
        1px solid
        rgba(213, 173, 88, 0.3);

      color:
        var(--gold-light);

      background:
        rgba(213, 173, 88, 0.08);
    }


    .product-bottom {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-top: auto;

      padding-top: 12px;
    }


    .product-price {

      display: flex;

      align-items: baseline;

      gap: 5px;

      min-width: 0;
    }


    .product-price .price-label {

      color:
        var(--faint);

      font-size: 0.62rem;
    }


    .product-price strong {

      color:
        var(--gold-light);

      font-size: 1.05rem;

      font-weight: 800;
    }


    .buy-btn {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      min-height: 42px;

      padding: 9px 13px;

      border:
        1px solid
        rgba(242, 210, 140, 0.5);

      border-radius: 11px;

      color: #101d2d;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      box-shadow:
        0 8px 18px
        rgba(213, 173, 88, 0.17);

      font-size: 0.75rem;

      font-weight: 800;

      transition:
        transform 150ms ease,
        filter 150ms ease,
        box-shadow 150ms ease;
    }


    .buy-btn:hover {

      filter:
        brightness(1.06);

      box-shadow:
        0 10px 24px
        rgba(213, 173, 88, 0.26);
    }


    .buy-btn:active {

      transform:
        translateY(1px)
        scale(0.985);
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .empty-products {

      grid-column: 1 / -1;

      display: grid;

      min-height: 188px;

      place-items: center;

      padding: 25px;

      border:
        1px dashed
        rgba(158, 176, 196, 0.32);

      border-radius:
        var(--radius-md);

      background:
        rgba(13, 27, 45, 0.54);

      text-align: center;
    }


    .empty-state {

      grid-column: 1 / -1;

      display: grid;

      min-height: 188px;

      place-items: center;

      padding: 25px;

      border:
        1px dashed
        rgba(158, 176, 196, 0.32);

      border-radius:
        var(--radius-md);

      background:
        rgba(13, 27, 45, 0.54);

      text-align: center;
    }


    .empty-icon {

      display: grid;

      width: 52px;

      height: 52px;

      margin:
        0
        auto
        10px;

      place-items: center;

      border:
        1px solid
        rgba(213, 173, 88, 0.3);

      border-radius: 16px;

      color:
        var(--gold-light);

      background:
        rgba(213, 173, 88, 0.08);

      font-size: 1.35rem;
    }


    .empty-title {

      margin: 0;

      color:
        var(--text);

      font-size: 0.96rem;

      font-weight: 800;
    }


    .empty-copy {

      margin: 5px 0 0;

      color:
        var(--muted);

      font-size: 0.78rem;
    }


    /* =====================================================
       MODAL
    ===================================================== */

    #modal {

      position: fixed;

      z-index: 50;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      padding:
        calc(18px + var(--safe-top))
        16px
        calc(18px + var(--safe-bottom));

      background:
        rgba(3, 10, 19, 0.74);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);
    }


    #modal.active,
    #modal.is-open {

      display: flex;

      animation:
        fade-in 180ms ease both;
    }


    #modalContent {

      position: relative;

      width:
        min(
          100%,
          560px
        );

      max-height:
        min(82%, 700px);

      overflow: auto;

      padding:
        clamp(
          20px,
          5vw,
          30px
        );

      border:
        1px solid
        rgba(213, 173, 88, 0.32);

      border-radius:
        var(--radius-lg);

      color:
        var(--text);

      background:
        linear-gradient(
          155deg,
          #18334e,
          #0d1b2d 72%
        );

      box-shadow:
        0 30px 85px
        rgba(0, 0, 0, 0.45);

      animation:
        modal-in 220ms ease both;

      scrollbar-color:
        var(--gold)
        transparent;
    }


    /* =====================================================
       MODAL CLOSE
    ===================================================== */

    .modal-close {

      position: absolute;

      top: 12px;

      left: 12px;

      z-index: 5;

      display: inline-grid;

      width: 34px;

      height: 34px;

      place-items: center;

      border:
        1px solid
        var(--line);

      border-radius: 10px;

      color:
        var(--text);

      background:
        rgba(8, 17, 31, 0.62);

      font-size: 1.2rem;

      line-height: 1;

      transition:
        background 160ms ease,
        border-color 160ms ease;
    }


    .modal-close:hover {

      border-color:
        rgba(242, 210, 140, 0.5);

      background:
        rgba(213, 173, 88, 0.16);
    }


    /* =====================================================
       BUY MODAL
    ===================================================== */

    .buy-modal {

      display: flex;

      flex-direction: column;

      gap: 18px;
    }


    .buy-modal-image {

      display: block;

      width: 100%;

      max-height: 230px;

      border-radius: 16px;

      object-fit: cover;

      border:
        1px solid
        var(--line);
    }


    .buy-modal-placeholder {

      display: grid;

      width: 100%;

      height: 170px;

      place-items: center;

      border:
        1px solid
        var(--line);

      border-radius: 16px;

      color:
        var(--gold-light);

      background:
        rgba(213, 173, 88, 0.08);

      font-size: 2.4rem;
    }


    .buy-modal-info {

      display: flex;

      flex-direction: column;

      gap: 13px;
    }


    .buy-modal-info h2 {

      margin: 0;

      padding-left: 35px;

      color:
        var(--text);

      font-size:
        clamp(
          1.15rem,
          4vw,
          1.45rem
        );

      font-weight: 800;

      line-height: 1.6;
    }


    .buy-modal-info > p {

      margin: 0;

      color:
        var(--muted);

      font-size: 0.82rem;

      line-height: 1.9;
    }


    .buy-info-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding:
        11px 13px;

      border:
        1px solid
        var(--line);

      border-radius: 12px;

      background:
        rgba(8, 17, 31, 0.28);
    }


    .buy-info-row span {

      color:
        var(--muted);

      font-size: 0.75rem;

      font-weight: 600;
    }


    .buy-info-row strong {

      direction: ltr;

      color:
        var(--gold-light);

      font-size: 0.9rem;

      font-weight: 800;

      unicode-bidi: plaintext;
    }


    /* =====================================================
       DELIVERY INFO
    ===================================================== */

    .delivery-info {

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 45px;

      padding:
        9px 12px;

      border-radius: 12px;

      font-size: 0.78rem;

      font-weight: 800;

      text-align: center;
    }


    .delivery-info.code {

      border:
        1px solid
        rgba(114, 210, 162, 0.32);

      color:
        var(--success);

      background:
        rgba(114, 210, 162, 0.08);
    }


    .delivery-info.manual {

      border:
        1px solid
        rgba(213, 173, 88, 0.32);

      color:
        var(--gold-light);

      background:
        rgba(213, 173, 88, 0.08);
    }


    .insufficient-warning {

      padding:
        11px 13px;

      border:
        1px solid
        rgba(255, 141, 141, 0.3);

      border-radius: 12px;

      color:
        var(--danger);

      background:
        rgba(255, 141, 141, 0.07);

      font-size: 0.76rem;

      font-weight: 700;

      line-height: 1.8;

      text-align: center;
    }


    /* =====================================================
       BUY ACTIONS
    ===================================================== */

    .buy-actions {

      display: grid;

      grid-template-columns:
        0.8fr
        1.2fr;

      gap: 10px;

      margin-top: 4px;
    }


    .modal-cancel-btn,
    .modal-confirm-btn {

      min-height: 46px;

      padding:
        9px 13px;

      border-radius: 12px;

      font-size: 0.8rem;

      font-weight: 800;

      transition:
        transform 150ms ease,
        filter 150ms ease,
        opacity 150ms ease;
    }


    .modal-cancel-btn {

      border:
        1px solid
        var(--line);

      color:
        var(--text);

      background:
        rgba(255, 255, 255, 0.04);
    }


    .modal-confirm-btn {

      border:
        1px solid
        rgba(242, 210, 140, 0.55);

      color:
        #101d2d;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      box-shadow:
        0 8px 22px
        rgba(213, 173, 88, 0.18);
    }


    .modal-cancel-btn:hover,
    .modal-confirm-btn:hover {

      filter:
        brightness(1.06);
    }


    .modal-cancel-btn:active,
    .modal-confirm-btn:active {

      transform:
        scale(0.985);
    }


    /* =====================================================
       PURCHASE LOADING
    ===================================================== */

    .purchase-loading {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 300px;

      padding: 20px;

      text-align: center;
    }


    .loading-spinner {

      width: 48px;

      height: 48px;

      margin-bottom: 20px;

      border:
        3px solid
        rgba(213, 173, 88, 0.18);

      border-top-color:
        var(--gold-light);

      border-radius: 50%;

      animation:
        spin 850ms linear infinite;
    }


    .purchase-loading h3 {

      margin: 0;

      color:
        var(--text);

      font-size: 1rem;

      font-weight: 800;
    }


    .purchase-loading p {

      margin: 8px 0 0;

      color:
        var(--muted);

      font-size: 0.75rem;
    }


    /* =====================================================
       PURCHASE RESULT
    ===================================================== */

    .purchase-result {

      display: flex;

      flex-direction: column;

      align-items: stretch;

      gap: 14px;

      padding-top: 8px;

      text-align: center;
    }


    .success-icon {

      display: grid;

      width: 62px;

      height: 62px;

      margin: 0 auto 2px;

      place-items: center;

      border:
        1px solid
        rgba(114, 210, 162, 0.4);

      border-radius: 50%;

      color:
        var(--success);

      background:
        rgba(114, 210, 162, 0.1);

      box-shadow:
        0 0 30px
        rgba(114, 210, 162, 0.08);

      font-size: 1.65rem;

      font-weight: 800;
    }


    .purchase-result h2 {

      margin: 0;

      color:
        var(--text);

      font-size: 1.25rem;

      font-weight: 800;
    }


    .result-subtitle {

      margin: -5px 0 3px;

      color:
        var(--muted);

      font-size: 0.78rem;

      line-height: 1.7;
    }


    .result-card {

      display: flex;

      flex-direction: column;

      gap: 0;

      overflow: hidden;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      background:
        rgba(8, 17, 31, 0.28);

      text-align: right;
    }


    .result-card > div {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding:
        12px 14px;

      border-bottom:
        1px solid
        var(--line);
    }


    .result-card > div:last-child {

      border-bottom: 0;
    }


    .result-card span {

      color:
        var(--muted);

      font-size: 0.72rem;
    }


    .result-card strong {

      color:
        var(--gold-light);

      font-size: 0.82rem;

      font-weight: 800;
    }


    /* =====================================================
       MANUAL NOTICE
    ===================================================== */

    .manual-notice {

      padding:
        13px 14px;

      border:
        1px solid
        rgba(213, 173, 88, 0.26);

      border-radius: 13px;

      color:
        var(--gold-light);

      background:
        rgba(213, 173, 88, 0.07);

      font-size: 0.76rem;

      font-weight: 700;

      line-height: 1.9;

      text-align: center;
    }


    /* =====================================================
       CODE BOX
    ===================================================== */

    .code-box {

      display: flex;

      flex-direction: column;

      gap: 9px;

      padding:
        16px;

      border:
        1px solid
        rgba(114, 210, 162, 0.32);

      border-radius: 15px;

      background:
        rgba(114, 210, 162, 0.06);

      text-align: center;
    }


    .code-box span {

      color:
        var(--muted);

      font-size: 0.7rem;

      font-weight: 700;
    }


    .code-box strong {

      display: block;

      overflow-x: auto;

      padding:
        11px 9px;

      border:
        1px dashed
        rgba(114, 210, 162, 0.3);

      border-radius: 10px;

      color:
        var(--success);

      background:
        rgba(0, 0, 0, 0.18);

      direction: ltr;

      font-family:
        monospace;

      font-size:
        clamp(
          0.85rem,
          3.5vw,
          1.05rem
        );

      font-weight: 800;

      letter-spacing: 0.04em;

      text-align: center;

      white-space: nowrap;

      user-select: all;
    }


    /* =====================================================
       RESULT BUTTONS
    ===================================================== */

    .copy-code-btn,
    .result-close-btn {

      width: 100%;

      min-height: 46px;

      border-radius: 12px;

      font-size: 0.8rem;

      font-weight: 800;

      transition:
        transform 150ms ease,
        filter 150ms ease;
    }


    .copy-code-btn {

      border:
        1px solid
        rgba(119, 197, 251, 0.32);

      color:
        var(--blue-soft);

      background:
        rgba(76, 163, 230, 0.08);
    }


    .result-close-btn {

      border:
        1px solid
        rgba(242, 210, 140, 0.5);

      color:
        #101d2d;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );
    }


    .copy-code-btn:hover,
    .result-close-btn:hover {

      filter:
        brightness(1.06);
    }


    .copy-code-btn:active,
    .result-close-btn:active {

      transform:
        scale(0.985);
    }


    /* =====================================================
       TOAST
    ===================================================== */

    #toast {

      position: fixed;

      z-index: 60;

      right: 50%;

      bottom:
        calc(
          20px +
          var(--safe-bottom)
        );

      display: none;

      width:
        min(
          calc(100% - 32px),
          440px
        );

      padding:
        12px 16px;

      border:
        1px solid
        rgba(114, 210, 162, 0.35);

      border-radius: 14px;

      color:
        #e8fff1;

      background:
        rgba(13, 55, 43, 0.94);

      box-shadow:
        0 16px 42px
        rgba(0, 0, 0, 0.32);

      font-size: 0.82rem;

      font-weight: 700;

      line-height: 1.7;

      text-align: center;

      transform:
        translateX(50%);
    }


    #toast.show,
    #toast.is-visible {

      display: block;

      animation:
        toast-in 220ms ease both;
    }


    #toast.error {

      border-color:
        rgba(255, 141, 141, 0.38);

      color:
        #ffe9e9;

      background:
        rgba(76, 24, 30, 0.95);
    }


    #toast.info {

      border-color:
        rgba(119, 197, 251, 0.34);

      color:
        #e5f5ff;

      background:
        rgba(18, 48, 73, 0.95);
    }


    #toast.success {

      border-color:
        rgba(114, 210, 162, 0.35);

      color:
        #e8fff1;

      background:
        rgba(13, 55, 43, 0.94);
    }


    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes reveal {

      from {

        opacity: 0;

        transform:
          translateY(12px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes fade-in {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes modal-in {

      from {

        opacity: 0;

        transform:
          translateY(12px)
          scale(0.98);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes toast-in {

      from {

        opacity: 0;

        transform:
          translate(50%, 12px);
      }

      to {

        opacity: 1;

        transform:
          translate(50%, 0);
      }
    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 620px) {

      .store-shell {

        padding-right: 12px;

        padding-left: 12px;
      }


      .topbar {

        grid-template-columns: 1fr;

        gap: 14px;

        padding: 14px;
      }


      .user-summary {

        justify-content:
          space-between;

        padding-top: 12px;

        border-top:
          1px solid
          var(--line);
      }


      .balance-card {

        min-width: 122px;
      }


      .hero {

        margin-top: 16px;
      }


      .products-section {

        margin-top: 23px;
      }


      .section-heading {

        align-items: center;
      }


      .product-bottom {

        align-items:
          stretch;

        flex-direction:
          column;
      }


      .product-price {

        justify-content:
          flex-start;
      }


      .buy-btn {

        width: 100%;
      }


      .buy-actions {

        grid-template-columns:
          1fr;
      }


      #modalContent {

        max-height:
          88%;
      }
    }


    @media (max-width: 360px) {

      .brand-caption {
        display: none;
      }


      .balance-card {
        min-width: 104px;
      }


      #products {
        grid-template-columns: 1fr;
      }


      .user-summary {
        gap: 7px;
      }
    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        scroll-behavior:
          auto !important;

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main
    class="store-shell"
    aria-label="واجهة المتجر الليبي"
  >


    <!-- ===================================================
         TOP BAR
    ==================================================== -->

    <header
      class="topbar"
      aria-label="معلومات المتجر والحساب"
    >

      <div class="brand-user">

        <div
          class="brand-mark"
          aria-hidden="true"
        >
          ل
        </div>


        <div class="brand-copy">

          <p class="brand-name">
            المتجر الليبي
          </p>

          <p class="brand-caption">
            وجهتك الرقمية الموثوقة
          </p>

        </div>

      </div>


      <div
        class="user-summary"
        aria-label="ملخص حساب المستخدم"
      >

        <div
          class="avatar-frame"
          aria-hidden="true"
        >

          <img
            id="userAvatar"
            loading="lazy"
            alt=""
          >

        </div>


        <div class="user-details">

          <p id="userName">
            مستخدم تيليجرام
          </p>

          <span id="userId">
            —
          </span>

        </div>


        <div class="balance-card">

          <span class="balance-label">
            رصيدك
          </span>

          <strong id="balance">
            0
          </strong>

        </div>

      </div>

    </header>


    <!-- ===================================================
         HERO
    ==================================================== -->

    <section
      class="hero"
      aria-labelledby="welcome"
    >

      <div class="hero-content">

        <div class="eyebrow">
          تسوّق بثقة
        </div>


        <h1 id="welcome">
          مرحبًا بك في المتجر الليبي
        </h1>


        <p class="hero-description">
          اكتشف منتجات رقمية مختارة بعناية،
          بطلب سريع وتجربة شراء سلسة من داخل تيليجرام.
        </p>

      </div>

    </section>


    <!-- ===================================================
         PRODUCTS
    ==================================================== -->

    <section
      class="products-section"
      aria-labelledby="products-title"
    >

      <div class="section-heading">

        <div class="section-title-wrap">

          <h2
            id="products-title"
            class="section-title"
          >
            المنتجات المتاحة
          </h2>

        </div>


        <div class="count-badge">

          <span id="productsCount">
            0
          </span>

          <span>
            منتج
          </span>

        </div>

      </div>


      <div
        id="products"
        aria-live="polite"
        aria-label="قائمة المنتجات"
      >

        <div class="empty-products">

          <div>

            <div
              class="empty-icon"
              aria-hidden="true"
            >
              ✦
            </div>


            <p class="empty-title">
              جاري تحميل المنتجات...
            </p>


            <p class="empty-copy">
              يرجى الانتظار لحظات.
            </p>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       MODAL
  ====================================================== -->

  <div
    id="modal"
    role="dialog"
    aria-modal="true"
    aria-label="نافذة المتجر"
    aria-hidden="true"
  >

    <div
      id="modalContent"
      tabindex="-1"
    >

      <button
        class="modal-close"
        type="button"
        aria-label="إغلاق النافذة"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!-- =====================================================
       TELEGRAM INITIALIZATION
  ====================================================== -->

  <script>

    "use strict";


    const telegramWebApp =
      window.Telegram?.WebApp || null;


    /* =====================================================
       TELEGRAM INIT
    ===================================================== */

    function initializeTelegram() {

      if (!telegramWebApp) {

        console.warn(
          "Telegram WebApp is not available."
        );

        return;
      }


      try {

        telegramWebApp.ready();

        telegramWebApp.expand();


        if (
          typeof telegramWebApp.enableClosingConfirmation ===
          "function"
        ) {

          telegramWebApp
            .enableClosingConfirmation();

        }


        const theme =
          telegramWebApp.themeParams || {};


        const root =
          document.documentElement;


        if (theme.button_color) {

          root.style.setProperty(
            "--blue",
            theme.button_color
          );
        }


        if (theme.button_text_color) {

          root.style.setProperty(
            "--blue-soft",
            theme.button_text_color
          );
        }


        if (theme.hint_color) {

          root.style.setProperty(
            "--muted",
            theme.hint_color
          );
        }

      } catch (error) {

        console.warn(
          "Telegram initialization warning:",
          error
        );
      }
    }


    /* =====================================================
       TELEGRAM USER
    ===================================================== */

    function populateTelegramUser() {

      if (
        !telegramWebApp ||
        !telegramWebApp.initDataUnsafe ||
        !telegramWebApp.initDataUnsafe.user
      ) {

        return;
      }


      const user =
        telegramWebApp
          .initDataUnsafe
          .user;


      const name =
        [
          user.first_name,
          user.last_name
        ]
          .filter(Boolean)
          .join(" ")
          ||
          user.username
          ||
          "مستخدم تيليجرام";


      const userName =
        document.getElementById(
          "userName"
        );


      const userId =
        document.getElementById(
          "userId"
        );


      const userAvatar =
        document.getElementById(
          "userAvatar"
        );


      if (userName) {

        userName.textContent =
          user.username
            ? name +
              "  @" +
              user.username
            : name;
      }


      if (userId) {

        userId.textContent =
          user.id
            ? "ID: " +
              user.id
            : "—";
      }


      if (userAvatar) {

        if (user.photo_url) {

          userAvatar.src =
            user.photo_url;

          userAvatar.alt =
            "صورة " +
            name;

          userAvatar.style.display =
            "block";

        } else {

          userAvatar.style.display =
            "none";


          const avatarFrame =
            userAvatar.parentElement;


          if (avatarFrame) {

            avatarFrame.textContent =
              (
                name
                  .trim()
                  .charAt(0)
                ||
                "م"
              ).toUpperCase();
          }
        }
      }
    }


    /* =====================================================
       MODAL ACCESSIBILITY
    ===================================================== */

    function prepareModal() {

      const modal =
        document.getElementById(
          "modal"
        );


      if (!modal) {
        return;
      }


      modal.addEventListener(
        "click",
        function (event) {

          if (
            event.target ===
            modal
          ) {

            if (
              !window.purchaseInProgress
            ) {

              if (
                typeof window.closeModal ===
                "function"
              ) {

                window.closeModal();
              }
            }
          }
        }
      );
    }


    /* =====================================================
       DOM READY
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        initializeTelegram();

        populateTelegramUser();

        prepareModal();


        document.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key ===
              "Escape"
            ) {

              const modal =
                document.getElementById(
                  "modal"
                );


              if (
                modal &&
                (
                  modal.classList.contains(
                    "active"
                  ) ||
                  modal.classList.contains(
                    "is-open"
                  )
                )
              ) {

                if (
                  typeof window.closeModal ===
                  "function"
                ) {

                  window.closeModal();
                }
              }
            }
          }
        );

      }
    );

  </script>


  <!-- =====================================================
       STORE APP
       v=11 prevents old browser cache
  ====================================================== -->

  <script
    src="/app.js?v=11"
  ></script>


</body>
</html>
